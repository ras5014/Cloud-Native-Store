[PARSER]
    Name    pino_json
    Format  json


# [PARSER] tells Fluent Bit how to read and structure your logs.

# Name pino_json
# Creates a parser named "pino_json" for Pino's log format
# You reference it in filters with Parser pino_json
# Format json
# Tells Fluent Bit: "These logs are JSON, parse them into fields!"
# What It Does (Simple)
# Before parsing:

# Run
# {"time":"10:30","level":"info","msg":"User logged in"}
# After parsing with Format json:

# ${time} → "10:30"
# ${level} → "info"
# ${msg} → "User logged in"
# Why It Matters
# Without Parser	With PARSER
# Logs are just text	Logs become structured data
# Can't search by field	Easy to filter: where ${level} == "error"
# Hard to analyze	Each field is accessible and queryable
# TL;DR
# It converts raw JSON logs into structured fields you can easily filter, route, and analyze! 🎯