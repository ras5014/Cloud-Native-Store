# Flush 1: Fluent Bit will flush (send) logs every 1 second. This balances between performance and log freshness.
# Log_level info: Sets the minimum verbosity level for Fluent Bit itself to info.
[SERVICE]
    Flush   1
    Log_level info
    Parsers_File parsers.conf

# Name forward: Uses the Fluentd Forward protocol (TCP-based) to receive logs from other Fluent agents or applications.
# Listen 0.0.0.0: Listens on all network interfaces (not just localhost).
# Port 24224: The port where your application sends logs via the fluentd protocol.
# Your logger is configured to send logs here! Your Pino logger would typically output to stdout, which gets captured by Fluent Bit.
[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# Log Parsing & Transformation
# Name parser: This filter's name is "parser".
# Match cloud-native-store.*: Only processes logs that start with cloud-native-store. (your service prefix).
# Key_Name log: Stores the parsed JSON data in a field called log.
# Parser pino_json: Uses Fluent Bit's built-in parser to understand Pino's JSON log format.
# Reserve_Data On: Keeps extra fields that don't match the parser schema (useful for custom fields).
[FILTER]
    Name         parser
    Match        cloud-native-store.*
    Key_Name     log
    Parser       pino_json
    Reserve_Data On

# Where Logs Go
# Name stdout: Sends processed logs to standard output (stdout).
# **Match ***: Applies this rule to all matching input streams.
[OUTPUT]
    Name  stdout
    Match *


# How It Works Together
# Your application's Pino logger outputs JSON logs to stdout
# Fluent Bit captures these logs via the Forward protocol on port 24224
# The parser filter extracts structured data from Pino's JSON format
# Logs are then sent to stdout (which could be forwarded to Elasticsearch, Loki, CloudWatch, etc.)
# Typical Use Case
# This setup is common in cloud-native environments where you want:

# Centralized log aggregation
# Structured logging for easier querying
# Log retention and analysis across multiple services